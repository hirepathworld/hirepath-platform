<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HIREPATH | Admin Login</title>
  <style>
    *{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#172554,#2563eb);padding:20px;color:#172554}.login-card{width:min(100%,420px);background:#fff;padding:34px;border-radius:16px;box-shadow:0 18px 55px #0003}.brand{text-align:center;color:#2563eb;font-size:28px;font-weight:800;margin-bottom:8px}.subtitle{text-align:center;color:#64748b;margin:0 0 26px}label{display:block;font-weight:700;margin:16px 0 7px}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}button{width:100%;padding:14px;border:0;border-radius:8px;background:#2563eb;color:white;font-size:16px;font-weight:700;cursor:pointer;margin-top:22px}button:disabled{opacity:.6;cursor:wait}#message{min-height:24px;color:#b91c1c;font-size:14px;margin-top:14px}.back{display:block;text-align:center;margin-top:18px;color:#2563eb;text-decoration:none}
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand">HIREPATH</div>
    <p class="subtitle">Admin Portal</p>
    <form id="loginForm">
      <label for="email">Admin email</label>
      <input id="email" type="email" autocomplete="username" value="hirepathofficial@gmail.com" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button id="loginButton" type="submit">Sign in</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
    <a class="back" href="/">← Back to HIREPATH website</a>
  </main>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const SUPABASE_URL = 'https://xlzqqhhwthglsxwuzxog.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_nV--4uQRFgSozM18c1VvfA_kpsR4DZh';
    const ADMIN_EMAIL = 'hirepathofficial@gmail.com';
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const form = document.getElementById('loginForm');
    const button = document.getElementById('loginButton');
    const message = document.getElementById('message');

    const { data: { session } } = await supabase.auth.getSession();
    if (session?.user?.email?.toLowerCase() === ADMIN_EMAIL) location.replace('/admin.html');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = '';
      button.disabled = true;
      button.textContent = 'Signing in...';
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      if (email !== ADMIN_EMAIL) {
        message.textContent = 'This email is not authorized for the admin portal.';
        button.disabled = false; button.textContent = 'Sign in'; return;
      }
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        message.textContent = error.message;
        button.disabled = false; button.textContent = 'Sign in'; return;
      }
      location.replace('/admin.html');
    });
  </script>
</body>
</html>
